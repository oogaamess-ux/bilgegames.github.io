<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FindTheN</title>
  <script src="https://www.youtube.com/game_api/v1"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #081725; }
    body { display: grid; place-items: center; font-family: system-ui,sans-serif; color: #e7f8ff; }
    #game { position: relative; width: min(100vw,56.25vh); height: min(100vh,177.778vw); }
    canvas { display: block; width: 100%; height: 100%; background: #081725; touch-action: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #081725; gap: 18px; padding: 24px; text-align: center; }
    progress { width: 75%; accent-color: #43dec2; }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" tabindex="0" aria-label="FindTheN game"></canvas>
    <div id="loading"><strong>FindTheN</strong><span id="status">Loading game…</span><progress id="progress" max="1" value="0"></progress></div>
  </main>
  <script src="playables.js"></script>
  <script src="Build/WebGL.loader.js"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    FindTheNPlatform.prepare().then(() => createUnityInstance(canvas, {
      dataUrl: 'Build/WebGL.data.unityweb',
      frameworkUrl: 'Build/WebGL.framework.js.unityweb',
      codeUrl: 'Build/WebGL.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'BILGEGAMES',
      productName: 'FindTheN',
      productVersion: '1.4',
      autoSyncPersistentDataPath: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    }, value => document.getElementById('progress').value = value)).then(instance => {
      window.unityInstance = instance;
      document.getElementById('loading').hidden = true;
      document.getElementById('loading').style.display = 'none';
      canvas.focus();
    }).catch(error => {
      document.getElementById('status').textContent = 'The game or saved progress could not load. Please refresh to retry.';
      console.error(error);
    });
  </script>
</body>
</html>
